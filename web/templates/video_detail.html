{% extends "base.html" %}

{% block title %}视频详情 - YouTube 视频摘要工具{% endblock %}

{% block content %}
<!-- 加载状态 -->
<div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">加载中...</div>
</div>

<!-- 视频详情 -->
<div id="video-detail" style="display: none;">
    <!-- 基本信息 -->
    <div class="card">
        <div class="card-header">
            <span id="video-title">视频标题</span>
            <span id="video-status-badge"></span>
        </div>

        <div id="video-thumbnail-container"></div>

        <div class="video-meta" style="margin-top: 1rem;">
            <p><strong>频道：</strong><span id="video-channel">-</span></p>
            <p><strong>时长：</strong><span id="video-duration">-</span></p>
            <p><strong>观看次数：</strong><span id="video-views">-</span></p>
            <p><strong>上传日期：</strong><span id="video-date">-</span></p>
            <p><strong>视频链接：</strong><a id="video-url" href="#" target="_blank">在 YouTube 观看</a></p>
        </div>

        <div id="video-categories" class="mt-3"></div>
        <div id="video-tags" class="mt-2"></div>

        <div class="video-actions mt-3">
            <a href="/videos" class="btn btn-secondary">← 返回列表</a>
            <button id="delete-btn" class="btn btn-danger">🗑️ 删除视频</button>
        </div>
    </div>

    <!-- AI 摘要 -->
    <div id="summary-container"></div>

    <!-- 字幕内容 -->
    <div id="transcript-container"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const videoId = "{{ video_id }}";
</script>
<script src="/static/js/video_detail.js"></script>
{% endblock %}
