<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YouTube 视频摘要工具{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">📺 YouTube 摘要工具</a>
            <ul class="navbar-menu">
                <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">首页</a></li>
                <li><a href="/videos" class="{% if '/videos' in request.url.path %}active{% endif %}">视频列表</a></li>
                <li><a href="/stats" class="{% if request.url.path == '/stats' %}active{% endif %}">统计</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- 公共 JavaScript -->
    <script src="/static/js/common.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
